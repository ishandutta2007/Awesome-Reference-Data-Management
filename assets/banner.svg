<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#fef08a" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="goldNodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="cyanNodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="purpleNodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8b4fe" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>

    <linearGradient id="emeraldNodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4" />
      <circle cx="40" cy="40" r="1" fill="#334155" fill-opacity="0.5" />
    </pattern>

    <style>
      .pulse-gold {
        animation: pulseGoldAnim 3.5s ease-in-out infinite alternate;
      }
      .pulse-cyan {
        animation: pulseCyanAnim 4s ease-in-out infinite alternate;
      }
      .stream-line {
        stroke-dasharray: 6, 6;
        animation: flowDash 20s linear infinite;
      }
      .stream-reverse {
        stroke-dasharray: 5, 5;
        animation: flowDashRev 25s linear infinite;
      }
      .floating-node-1 {
        animation: floatOne 5s ease-in-out infinite alternate;
      }
      .floating-node-2 {
        animation: floatTwo 6s ease-in-out infinite alternate;
      }
      .floating-node-3 {
        animation: floatThree 5.5s ease-in-out infinite alternate;
      }

      @keyframes pulseGoldAnim {
        0% { transform: scale(1); opacity: 0.7; }
        100% { transform: scale(1.18); opacity: 1; }
      }
      @keyframes pulseCyanAnim {
        0% { transform: scale(0.95); opacity: 0.5; }
        100% { transform: scale(1.15); opacity: 0.9; }
      }
      @keyframes flowDash {
        from { stroke-dashoffset: 200; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes flowDashRev {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 200; }
      }
      @keyframes floatOne {
        0% { transform: translateY(0px) translateX(0px); }
        100% { transform: translateY(-7px) translateX(4px); }
      }
      @keyframes floatTwo {
        0% { transform: translateY(0px) translateX(0px); }
        100% { transform: translateY(8px) translateX(-5px); }
      }
      @keyframes floatThree {
        0% { transform: translateY(0px) translateX(0px); }
        100% { transform: translateY(-6px) translateX(-4px); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="420" fill="url(#bgGrad)" />
  <rect width="1280" height="420" fill="url(#grid)" />

  <!-- Background Glow Orbs -->
  <circle cx="640" cy="190" r="280" fill="url(#goldGlow)" opacity="0.18" class="pulse-gold" />
  <circle cx="1060" cy="180" r="180" fill="url(#cyanGlow)" opacity="0.15" class="pulse-cyan" />
  <circle cx="220" cy="220" r="160" fill="url(#cyanGlow)" opacity="0.12" class="pulse-cyan" />

  <!-- Animated Data Connection Lines (Master Data Streams) -->
  <g stroke-linecap="round" opacity="0.65">
    <!-- Left to Center connections -->
    <path class="stream-line" d="M 160,110 Q 380,130 640,195" fill="none" stroke="#38bdf8" stroke-width="1.8" />
    <path class="stream-reverse" d="M 140,280 Q 370,260 640,195" fill="none" stroke="#a855f7" stroke-width="1.6" />
    <path class="stream-line" d="M 280,340 Q 450,290 640,195" fill="none" stroke="#34d399" stroke-width="1.6" />

    <!-- Center to Right connections -->
    <path class="stream-line" d="M 640,195 Q 890,130 1120,110" fill="none" stroke="#fbbf24" stroke-width="2" />
    <path class="stream-reverse" d="M 640,195 Q 880,260 1140,280" fill="none" stroke="#38bdf8" stroke-width="1.6" />
    <path class="stream-line" d="M 640,195 Q 820,310 1000,340" fill="none" stroke="#f472b6" stroke-width="1.5" />

    <!-- Cross Entity Network Links -->
    <path d="M 160,110 L 140,280" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="3,3" opacity="0.4" />
    <path d="M 1120,110 L 1140,280" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="3,3" opacity="0.4" />
  </g>

  <!-- Peripheral Data Entity Nodes -->
  <!-- Left Side Nodes -->
  <g class="floating-node-1">
    <circle cx="160" cy="110" r="26" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <circle cx="160" cy="110" r="10" fill="url(#cyanNodeGrad)" />
    <text x="160" y="152" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Customer Master</text>
  </g>

  <g class="floating-node-2">
    <circle cx="140" cy="280" r="24" fill="#0f172a" stroke="#a855f7" stroke-width="2" />
    <circle cx="140" cy="280" r="9" fill="url(#purpleNodeGrad)" />
    <text x="140" y="320" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Security Master</text>
  </g>

  <g class="floating-node-3">
    <circle cx="280" cy="340" r="20" fill="#0f172a" stroke="#34d399" stroke-width="2" />
    <circle cx="280" cy="340" r="7" fill="url(#emeraldNodeGrad)" />
    <text x="280" y="376" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Hierarchies</text>
  </g>

  <!-- Right Side Nodes -->
  <g class="floating-node-2">
    <circle cx="1120" cy="110" r="26" fill="#0f172a" stroke="#fbbf24" stroke-width="2" />
    <circle cx="1120" cy="110" r="10" fill="url(#goldNodeGrad)" />
    <text x="1120" y="152" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Product Catalog</text>
  </g>

  <g class="floating-node-1">
    <circle cx="1140" cy="280" r="24" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <circle cx="1140" cy="280" r="9" fill="url(#cyanNodeGrad)" />
    <text x="1140" y="320" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Legal Entity / LEI</text>
  </g>

  <g class="floating-node-3">
    <circle cx="1000" cy="340" r="20" fill="#0f172a" stroke="#f472b6" stroke-width="2" />
    <circle cx="1000" cy="340" r="7" fill="#f472b6" />
    <text x="1000" y="376" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Reference Codes</text>
  </g>

  <!-- Central Golden Record Hub -->
  <g>
    <!-- Outer Pulsing Rings -->
    <circle cx="640" cy="195" r="54" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6" class="stream-line" />
    <circle cx="640" cy="195" r="42" fill="#0f172a" stroke="#fbbf24" stroke-width="3" filter="drop-shadow(0 0 16px rgba(245, 158, 11, 0.6))" />
    <!-- Core Golden Orb -->
    <circle cx="640" cy="195" r="22" fill="url(#goldNodeGrad)" />
    <!-- Star icon inside Golden Record -->
    <polygon points="640,183 643,191 652,192 645,198 647,207 640,202 633,207 635,198 628,192 637,191" fill="#ffffff" opacity="0.95" />
    <text x="640" y="260" fill="#fef08a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" text-anchor="middle">GOLDEN RECORD</text>
  </g>

  <!-- Title and Header Text Section -->
  <g text-anchor="middle">
    <!-- Top Pill Badge -->
    <rect x="520" y="32" width="240" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="640" y="49" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">ENTERPRISE DATA ARCHITECTURE</text>

    <!-- Main Title -->
    <text x="640" y="105" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" letter-spacing="-0.5" filter="drop-shadow(0 3px 12px rgba(0,0,0,0.7))">
      Awesome Reference Data Management
    </text>

    <!-- Subtitle -->
    <text x="640" y="136" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" letter-spacing="0.2">
      Curated Multi-Domain MDM • Golden Records • Entity Resolution • Data Stewardship
    </text>

    <!-- Bottom Feature Badges / Chips -->
    <g transform="translate(370, 375)">
      <rect x="0" y="0" width="125" height="24" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="0.8" opacity="0.9" />
      <text x="62.5" y="16" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Golden Records</text>

      <rect x="135" y="0" width="135" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="0.8" opacity="0.9" />
      <text x="202.5" y="16" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Multi-Domain MDM</text>

      <rect x="280" y="0" width="125" height="24" rx="12" fill="#1e293b" stroke="#a855f7" stroke-width="0.8" opacity="0.9" />
      <text x="342.5" y="16" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Entity Resolution</text>

      <rect x="415" y="0" width="130" height="24" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="0.8" opacity="0.9" />
      <text x="480" y="16" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Data Governance</text>
    </g>
  </g>
</svg>
